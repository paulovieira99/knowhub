services:
  postgres:
    image: postgres:16-alpine
    container_name: knowhub_postgres
    environment:
      POSTGRES_DB: knowhub
      POSTGRES_USER: knowhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowhub"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowhub_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://knowhub:${POSTGRES_PASSWORD}@postgres:5432/knowhub
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no arquivo .env}
      UPLOAD_DIR: /app/uploads
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowhub_frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: knowhub_nginx
    ports:
      - "${PORT:-3000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
